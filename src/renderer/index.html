<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek YukiRyou</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <header
      class="window-toolbar"
      data-testid="window-drag-region"
      aria-label="窗口拖动区域"
    >
      <nav class="windows-menu" data-testid="windows-menu" aria-label="应用菜单" hidden>
        <button type="button" data-window-menu="file">文件</button>
        <button type="button" data-window-menu="edit">编辑</button>
        <button type="button" data-window-menu="view">视图</button>
        <button type="button" data-window-menu="help">帮助</button>
      </nav>
      <button
        class="companion-toggle"
        data-testid="companion-toggle"
        type="button"
        aria-label="切换桌面伴侣侧栏"
        hidden
      >
        <span class="companion-toggle-glyph" aria-hidden="true"></span>
      </button>
    </header>
    <section class="window-content">
      <main class="loading-shell" aria-live="polite">
        <div class="ambient ambient-one" aria-hidden="true"></div>
        <div class="ambient ambient-two" aria-hidden="true"></div>
        <div class="brand-stage" aria-hidden="true">
          <span class="orbit orbit-outer"></span>
          <span class="orbit orbit-inner"></span>
          <span class="spark spark-one"></span>
          <span class="spark spark-two"></span>
          <div class="brand-frame">
            <img
              class="brand-image"
              src="/deepseek-yukiryou.png"
              alt=""
            />
            <span class="brand-shine"></span>
          </div>
        </div>
        <div class="loading-copy">
          <span class="eyebrow">DEEPSEEK YUKIRYOU</span>
          <h1>正在唤醒 Harness</h1>
          <p data-testid="startup-status">正在准备本地开发环境</p>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <nav class="failure-actions" aria-label="故障操作" hidden>
          <a class="primary" href="dsh-desktop://action/retry">重试启动</a>
          <a href="dsh-desktop://action/open-logs">打开日志</a>
          <a href="dsh-desktop://action/copy-diagnostics">复制诊断</a>
          <a href="dsh-desktop://action/export-diagnostics">导出诊断包</a>
        </nav>
      </main>
      <aside class="companion-panel" data-testid="companion-panel" hidden>
        <div
          class="companion-resizer"
          data-testid="companion-resizer"
          role="separator"
          aria-label="调整工作区面板宽度"
          aria-orientation="vertical"
          aria-valuemin="280"
          aria-valuemax="480"
          aria-valuenow="340"
          tabindex="0"
        ></div>
        <header class="companion-header">
          <div class="companion-heading">
            <span class="companion-eyebrow">工作区</span>
            <h2 data-testid="companion-workspace-title">当前工作区</h2>
          </div>
          <span class="companion-running" data-testid="companion-running" hidden>运行中</span>
        </header>
        <div class="companion-empty" data-testid="companion-empty">
          <span class="companion-empty-icon" aria-hidden="true">⌘</span>
          <strong>选择一个工作区会话</strong>
          <small>文件、变更与预览会显示在这里</small>
        </div>
        <div class="review-browser" data-testid="review-browser" hidden>
          <nav class="review-tabs" aria-label="工作区视图">
            <button type="button" data-review-tab="changes" aria-selected="true">变更 <span class="review-tab-count" data-testid="change-count">0</span></button>
            <button type="button" data-review-tab="files" aria-selected="false">文件</button>
            <button type="button" class="review-refresh" data-testid="review-refresh" aria-label="刷新工作区" title="刷新">
              <svg class="review-refresh-glyph" aria-hidden="true" viewBox="0 0 24 24" fill="none">
                <path d="M20 11a8 8 0 1 0-2.34 5.66" />
                <path d="M20 4v7h-7" />
              </svg>
            </button>
          </nav>
          <div class="review-query" data-testid="review-query">
            <label class="review-search">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="6.5" />
                <path d="m16 16 4 4" />
              </svg>
              <input
                type="search"
                data-testid="review-search"
                placeholder="筛选变更…"
                aria-label="筛选工作区变更"
                aria-keyshortcuts="Meta+P Control+P"
                autocomplete="off"
                maxlength="120"
                spellcheck="false"
              />
            </label>
            <select data-testid="change-filter" aria-label="变更类型">
              <option value="all">全部</option>
              <option value="staged">已暂存</option>
              <option value="unstaged">未暂存</option>
              <option value="added">新增</option>
              <option value="modified">修改</option>
              <option value="deleted">删除</option>
              <option value="conflicted">冲突</option>
            </select>
          </div>
          <section class="review-list" data-review-view="changes" aria-label="工作区变更"></section>
          <section class="review-list file-tree" data-review-view="files" aria-label="文件树" hidden></section>
          <p class="review-note" data-testid="review-note"></p>
        </div>
      </aside>
      <section class="preview-panel" data-testid="preview-panel" hidden>
        <header class="preview-toolbar">
          <div>
            <strong data-testid="preview-name">预览</strong>
            <small data-testid="preview-path"></small>
          </div>
          <div class="preview-actions">
            <div class="preview-navigation" aria-label="预览历史导航">
              <button type="button" data-testid="preview-back" aria-label="后退" aria-keyshortcuts="Meta+[ Control+[" title="后退（⌘[）" disabled><span class="preview-chevron preview-chevron-back" aria-hidden="true"></span></button>
              <button type="button" data-testid="preview-forward" aria-label="前进" aria-keyshortcuts="Meta+] Control+]" title="前进（⌘]）" disabled><span class="preview-chevron preview-chevron-forward" aria-hidden="true"></span></button>
            </div>
            <span class="preview-copy-feedback" data-testid="preview-copy-feedback" aria-live="polite" hidden></span>
            <details class="preview-copy-menu" data-testid="preview-copy-menu">
              <summary aria-label="复制预览位置" aria-haspopup="menu" title="复制预览位置">
                <svg class="preview-copy-glyph" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.4" y="5.4" width="7.4" height="7.4" rx="1.2"></rect><path d="M10.6 5.4V3.9c0-.7-.6-1.2-1.2-1.2H3.9c-.7 0-1.2.6-1.2 1.2v5.5c0 .7.6 1.2 1.2 1.2h1.5"></path></svg>
                <span class="preview-menu-chevron" aria-hidden="true"></span>
              </summary>
              <div class="preview-copy-popover" role="menu">
                <button type="button" role="menuitem" data-copy-target="path">复制相对路径</button>
                <button type="button" role="menuitem" data-copy-target="line" disabled>复制行号</button>
                <button type="button" role="menuitem" data-copy-target="path-line" disabled>复制 路径:行号</button>
              </div>
            </details>
            <button type="button" data-testid="preview-find-toggle" aria-label="在预览中查找" aria-keyshortcuts="Meta+F Control+F" title="在预览中查找（⌘F）">
              <svg class="preview-find-glyph" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.8" cy="6.8" r="4.1"></circle><path d="m10 10 3.2 3.2"></path></svg>
            </button>
            <button type="button" data-testid="preview-mode" hidden>源码</button>
            <button type="button" data-testid="preview-close" aria-label="关闭预览" aria-keyshortcuts="Escape"><span class="preview-close-glyph" aria-hidden="true"></span></button>
          </div>
        </header>
        <nav class="preview-find-bar" data-testid="preview-find-bar" aria-label="在预览中查找" hidden>
          <label>
            <svg class="preview-find-glyph" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.8" cy="6.8" r="4.1"></circle><path d="m10 10 3.2 3.2"></path></svg>
            <input type="search" data-testid="preview-find-input" aria-label="查找文本" placeholder="查找…" autocomplete="off" spellcheck="false">
          </label>
          <span data-testid="preview-find-progress" aria-live="polite">0 / 0</span>
          <button type="button" data-testid="preview-find-previous" aria-label="上一个匹配项" title="上一个匹配项（Shift+Enter）"><span class="preview-chevron preview-chevron-up" aria-hidden="true"></span></button>
          <button type="button" data-testid="preview-find-next" aria-label="下一个匹配项" title="下一个匹配项（Enter）"><span class="preview-chevron preview-chevron-down" aria-hidden="true"></span></button>
          <button type="button" data-testid="preview-find-close" aria-label="关闭查找"><span class="preview-close-glyph" aria-hidden="true"></span></button>
        </nav>
        <nav class="preview-review-bar" data-testid="preview-review-bar" aria-label="逐文件审阅" hidden>
          <button type="button" data-testid="review-previous" aria-label="上一个变更" title="上一个变更"><span class="preview-chevron preview-chevron-back" aria-hidden="true"></span></button>
          <span data-testid="review-progress">0 / 0</span>
          <button type="button" class="review-toggle-viewed" data-testid="review-toggle-viewed">标为已查看</button>
          <button type="button" data-testid="review-next" aria-label="下一个变更" title="下一个变更"><span class="preview-chevron preview-chevron-forward" aria-hidden="true"></span></button>
        </nav>
        <article class="preview-content" data-testid="preview-content"></article>
      </section>
    </section>
  </body>
</html>
