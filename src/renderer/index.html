<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek YukiRyou</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <header
      class="window-toolbar"
      data-testid="window-drag-region"
      aria-label="窗口拖动区域"
    ></header>
    <section class="window-content">
      <main class="loading-shell" aria-live="polite">
        <div class="mark" aria-hidden="true">YR</div>
        <h1>正在准备 DeepSeek YukiRyou</h1>
        <p>DeepSeek Harness 桌面运行环境初始化中……</p>
        <div class="progress" aria-hidden="true"><span></span></div>
        <nav class="failure-actions" aria-label="故障操作" hidden>
          <a class="primary" href="dsh-desktop://action/retry">重试启动</a>
          <a href="dsh-desktop://action/open-logs">打开日志</a>
          <a href="dsh-desktop://action/copy-diagnostics">复制诊断</a>
        </nav>
      </main>
    </section>
  </body>
</html>
