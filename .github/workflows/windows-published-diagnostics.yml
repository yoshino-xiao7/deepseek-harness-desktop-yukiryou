name: Windows published startup diagnostics

on:
  push:
    branches:
      - yukiryou/v0.2.3-beta.2
    paths:
      - '.github/workflows/windows-published-diagnostics.yml'
      - 'tests/e2e/windows-published-startup.test.ts'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to verify
        required: true
        default: v0.2.3-beta.1

permissions:
  contents: read

concurrency:
  group: windows-published-diagnostics
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.5'
  RUNNER_PWSH_PATH: 'C:\r\y\pwsh-7.6.4'

jobs:
  published_startup:
    name: Verify the published app on the real Windows profile
    runs-on: [self-hosted, Windows, X64, yukiryou-local]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Enable runner-local PowerShell 7
        shell: powershell
        run: |
          if (-not (Test-Path "$env:RUNNER_PWSH_PATH\pwsh.exe")) {
            throw "Runner PowerShell 7 is missing at $env:RUNNER_PWSH_PATH"
          }
          $env:RUNNER_PWSH_PATH | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Require an unlocked interactive Windows desktop
        run: |
          $sessionId = (Get-Process -Id $PID).SessionId
          if ($sessionId -eq 0) { throw 'Runner is executing in non-interactive Session 0' }
          $explorer = @(Get-Process explorer -ErrorAction SilentlyContinue | Where-Object SessionId -eq $sessionId)
          if ($explorer.Count -eq 0) { throw "No logged-in desktop was found in Session $sessionId" }
          # A residual/suspended LockApp process is not proof that an active
          # remote desktop is locked. Log it, but gate only on LogonUI.
          $lockApp = @(Get-Process LockApp -ErrorAction SilentlyContinue | Where-Object SessionId -eq $sessionId)
          "Residual LockApp processes: $($lockApp.Count)"
          $lockUi = @(Get-Process LogonUI -ErrorAction SilentlyContinue | Where-Object SessionId -eq $sessionId)
          if ($lockUi.Count -ne 0) { throw "Windows desktop Session $sessionId is locked" }
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${env:PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Download and extract the exact published portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.2.3-beta.1' }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'deepseek-yukiryou-published'
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          gh release download $env:RELEASE_TAG --pattern '*-portable.zip' --dir $download --clobber
          $archive = @(Get-ChildItem -LiteralPath $download -Filter '*-portable.zip')
          if ($archive.Count -ne 1) { throw "Expected one portable ZIP, found $($archive.Count)" }
          $extract = Join-Path $download 'extracted'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $archive[0].FullName -C $extract
          if ($LASTEXITCODE -ne 0) { throw "tar.exe exited with $LASTEXITCODE" }
          $executables = @(Get-ChildItem -LiteralPath $extract -Recurse -Filter 'DeepSeek YukiRyou.exe')
          if ($executables.Count -ne 1) { throw "Expected one executable, found $($executables.Count)" }
          "DSH_E2E_EXECUTABLE_PATH=$($executables[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Close an existing product instance before the isolated launch
        run: |
          Get-Process -Name 'DeepSeek YukiRyou' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
      - name: Reproduce the published wake-screen failure
        run: pnpm exec vitest run tests/e2e/windows-published-startup.test.ts --no-file-parallelism
      - name: Collect redacted application logs
        if: ${{ always() }}
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE 'out/windows-live-diagnostics/logs'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $source = Join-Path $env:APPDATA 'DeepSeek YukiRyou/logs'
          if (Test-Path -LiteralPath $source) {
            Get-ChildItem -LiteralPath $source -Filter 'desktop.log*' | Copy-Item -Destination $destination
          }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: windows-published-startup-${{ inputs.release_tag || 'v0.2.3-beta.1' }}
          path: out/windows-live-diagnostics/
          if-no-files-found: error
          retention-days: 7
