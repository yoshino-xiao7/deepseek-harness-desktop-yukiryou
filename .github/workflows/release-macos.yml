name: Release desktop (macOS + Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version, for example 1.0.0
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-desktop-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.5'
  PRODUCT_NAME: DeepSeek YukiRyou
  ARTIFACT_NAME: DeepSeek.YukiRyou
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}
  MACOS_SIGN_IDENTITY: 'Developer ID Application: HanTao Cao (7G6J4S76PN)'

jobs:
  windows:
    name: Build and verify Windows EXE + portable ZIP
    needs: verify_macos_automatic_update
    uses: ./.github/workflows/windows-candidate.yml
    with:
      release_version: ${{ inputs.version }}

  quality:
    name: Quality and version gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - name: Require a new matching version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const p=require('./package.json'); if (p.version !== process.env.RELEASE_VERSION) throw new Error('package.json version does not match workflow input')"
          test -s "docs/releases/${RELEASE_TAG}.md"
          node -e "const fs=require('node:fs'); const notes=fs.readFileSync('docs/releases/'+process.env.RELEASE_TAG+'.md','utf8'); if (/^# /m.test(notes)) throw new Error('Release notes must omit the H1 because GitHub already renders the release title'); if (!/^## 简体中文$/m.test(notes) || !/^## English$/m.test(notes)) throw new Error('Release notes must contain Simplified Chinese and English in the same file')"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; versions are immutable."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; tags are immutable."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build_candidate:
    name: Sign and build candidate
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:vendor -- --arch=arm64
      - run: pnpm runtime:verify
      - run: pnpm test:integration
      - name: Import Developer ID certificate into an ephemeral keychain
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "${CERTIFICATE_P12_BASE64}"
          test -n "${CERTIFICATE_PASSWORD}"
          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/release.keychain-db"
          printf '%s' "${CERTIFICATE_P12_BASE64}" | openssl base64 -d -A -out "${CERTIFICATE_PATH}"
          security create-keychain -p temporary-ci-keychain "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p temporary-ci-keychain "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary-ci-keychain "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
      - run: pnpm release:mac:candidate
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-candidate
          path: out/release-candidate/
          if-no-files-found: error
          retention-days: 7

  verify_candidate:
    name: Fresh-runner install, upgrade, and smoke gate
    needs: verify_macos_automatic_update
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: macos-release-candidate
          path: out/release-candidate
      - name: Install candidate into Applications and verify portability
        run: |
          pnpm verify:distribution -- \
            --kind=zip \
            --archive="out/release-candidate/${PRODUCT_NAME}-darwin-arm64-${RELEASE_VERSION}-candidate.zip" \
            --install-app="/Applications/${PRODUCT_NAME}.app" \
            --expect-version="${RELEASE_VERSION}" \
            --require-notarized=false \
            --candidate-manifest=out/release-candidate/candidate-manifest.json \
            --receipt=out/release-candidate/portable-verification.json
      - name: Start and restart the exact installed candidate
        env:
          DSH_E2E_EXECUTABLE_PATH: /Applications/DeepSeek YukiRyou.app/Contents/MacOS/DeepSeek YukiRyou
        run: pnpm exec vitest run tests/e2e/packaged-startup.test.ts tests/e2e/session-selection-restart.test.ts tests/e2e/plugin-startup-recovery.test.ts --no-file-parallelism
      - name: Download and extract the previous public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          previous_version="${previous_tag#v}"
          echo "DSH_PREVIOUS_EXPECTED_VERSION=${previous_version}" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/previous-release" "${RUNNER_TEMP}/previous-app"
          gh release download "${previous_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ARTIFACT_NAME}-darwin-arm64-${previous_version}.zip" \
            --dir "${RUNNER_TEMP}/previous-release"
          ditto -x -k \
            "${RUNNER_TEMP}/previous-release/${ARTIFACT_NAME}-darwin-arm64-${previous_version}.zip" \
            "${RUNNER_TEMP}/previous-app"
      - name: Verify upgrade from the previous public release
        env:
          DSH_E2E_EXECUTABLE_PATH: /Applications/DeepSeek YukiRyou.app/Contents/MacOS/DeepSeek YukiRyou
          DSH_PREVIOUS_EXECUTABLE_PATH: ${{ runner.temp }}/previous-app/DeepSeek YukiRyou.app/Contents/MacOS/DeepSeek YukiRyou
        run: pnpm test:upgrade
      - uses: actions/upload-artifact@v4
        with:
          name: macos-portable-verification
          path: out/release-candidate/portable-verification.json
          if-no-files-found: error
          retention-days: 7

  soak_candidate:
    name: Thirty-minute installed candidate soak
    needs: verify_candidate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: macos-release-candidate
          path: out/release-candidate
      - name: Install the exact candidate for soak
        run: |
          pnpm verify:distribution -- \
            --kind=zip \
            --archive="out/release-candidate/${PRODUCT_NAME}-darwin-arm64-${RELEASE_VERSION}-candidate.zip" \
            --install-app="/Applications/${PRODUCT_NAME}.app" \
            --expect-version="${RELEASE_VERSION}" \
            --require-notarized=false \
            --candidate-manifest=out/release-candidate/candidate-manifest.json \
            --receipt=out/release-candidate/soak-install-verification.json
      - name: Keep shell and Harness healthy for thirty minutes
        env:
          DSH_E2E_EXECUTABLE_PATH: /Applications/DeepSeek YukiRyou.app/Contents/MacOS/DeepSeek YukiRyou
        run: pnpm test:soak:app:release

  notarize:
    name: Notarize the exact verified candidate
    needs: soak_candidate
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: macos-release-candidate
          path: out/release-candidate
      - uses: actions/download-artifact@v5
        with:
          name: macos-portable-verification
          path: out/release-candidate
      - name: Import Developer ID certificate into an ephemeral keychain
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "${CERTIFICATE_P12_BASE64}"
          test -n "${CERTIFICATE_PASSWORD}"
          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/release.keychain-db"
          printf '%s' "${CERTIFICATE_P12_BASE64}" | openssl base64 -d -A -out "${CERTIFICATE_PATH}"
          security create-keychain -p temporary-ci-keychain "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p temporary-ci-keychain "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary-ci-keychain "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
      - name: Extract the verified candidate
        run: |
          mkdir -p "${RUNNER_TEMP}/candidate"
          ditto -x -k "out/release-candidate/${PRODUCT_NAME}-darwin-arm64-${RELEASE_VERSION}-candidate.zip" "${RUNNER_TEMP}/candidate"
      - name: Prepare App Store Connect API key
        env:
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          test -n "${API_KEY_P8_BASE64}"
          printf '%s' "${API_KEY_P8_BASE64}" | openssl base64 -d -A -out "${RUNNER_TEMP}/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/AuthKey.p8"
      - name: Submit once and wait inside CI
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_RELEASE_APP: ${{ runner.temp }}/candidate/DeepSeek YukiRyou.app
          MACOS_RELEASE_CANDIDATE: ${{ github.workspace }}/out/release-candidate/DeepSeek YukiRyou-darwin-arm64-${{ inputs.version }}-candidate.zip
          MACOS_RELEASE_PORTABLE_RECEIPT: ${{ github.workspace }}/out/release-candidate/portable-verification.json
          MACOS_RELEASE_SKIP_PACKAGE: 'true'
          MACOS_RELEASE_WAIT: 'true'
        run: |
          test -n "${APPLE_API_KEY_ID}"
          test -n "${APPLE_API_ISSUER}"
          pnpm release:mac
          pnpm release:mac:finish
      - uses: actions/upload-artifact@v4
        with:
          name: macos-notarized-artifacts
          path: |
            out/release/${{ env.ARTIFACT_NAME }}-${{ inputs.version }}-arm64.dmg
            out/release/${{ env.ARTIFACT_NAME }}-darwin-arm64-${{ inputs.version }}.zip
            out/release/SHA256SUMS.txt
            out/release/release-manifest.json
            out/release/notarization-log.json
          if-no-files-found: error
          retention-days: 14

  verify_final:
    name: Fresh-runner final DMG and ZIP gate
    needs: notarize
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: macos-notarized-artifacts
          path: out/release
      - name: Verify checksums
        working-directory: out/release
        run: shasum -a 256 -c SHA256SUMS.txt
      - name: Verify ZIP through Applications
        run: |
          pnpm verify:distribution -- \
            --kind=zip \
            --archive="out/release/${ARTIFACT_NAME}-darwin-arm64-${RELEASE_VERSION}.zip" \
            --install-app="/Applications/${PRODUCT_NAME}.app" \
            --expect-version="${RELEASE_VERSION}" \
            --require-notarized=true \
            --simulate-download=true
          mv "/Applications/${PRODUCT_NAME}.app" "${RUNNER_TEMP}/verified-from-zip.app"
      - name: Verify DMG through Applications
        run: |
          pnpm verify:distribution -- \
            --kind=dmg \
            --archive="out/release/${ARTIFACT_NAME}-${RELEASE_VERSION}-arm64.dmg" \
            --install-app="/Applications/${PRODUCT_NAME}.app" \
            --expect-version="${RELEASE_VERSION}" \
            --require-notarized=true \
            --simulate-download=true
      - name: Start the exact installed final application and wait for Harness
        env:
          DSH_E2E_EXECUTABLE_PATH: /Applications/DeepSeek YukiRyou.app/Contents/MacOS/DeepSeek YukiRyou
        run: pnpm exec vitest run tests/e2e/packaged-startup.test.ts --no-file-parallelism

  verify_macos_automatic_update:
    name: Previous public macOS update compatibility gate
    needs: build_candidate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: macos-release-candidate
          path: out/release-candidate
      - name: Resolve and install the previous public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          previous_version="${previous_tag#v}"
          test -n "${previous_version}"
          test "${previous_version}" != "${RELEASE_VERSION}"
          echo "PREVIOUS_PUBLIC_VERSION=${previous_version}" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/previous-release" "${RUNNER_TEMP}/previous-app"
          gh release download "${previous_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ARTIFACT_NAME}-darwin-arm64-${previous_version}.zip" \
            --dir "${RUNNER_TEMP}/previous-release"
          ditto -x -k \
            "${RUNNER_TEMP}/previous-release/${ARTIFACT_NAME}-darwin-arm64-${previous_version}.zip" \
            "${RUNNER_TEMP}/previous-app"
          test ! -e "/Applications/${PRODUCT_NAME}.app"
          ditto "${RUNNER_TEMP}/previous-app/${PRODUCT_NAME}.app" "/Applications/${PRODUCT_NAME}.app"
      - name: Create an isolated trusted mirror for the exact candidate
        if: ${{ env.PREVIOUS_PUBLIC_VERSION != '1.0.4' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/update-gate/assets" "${RUNNER_TEMP}/update-gate/metadata"
          cp \
            "out/release-candidate/${PRODUCT_NAME}-darwin-arm64-${RELEASE_VERSION}-candidate.zip" \
            "${RUNNER_TEMP}/update-gate/assets/${ARTIFACT_NAME}-darwin-arm64-${RELEASE_VERSION}.zip"
          node scripts/prepare-update-metadata.ts \
            --assets="${RUNNER_TEMP}/update-gate/assets" \
            --output="${RUNNER_TEMP}/update-gate/metadata" \
            --version="${RELEASE_VERSION}" \
            --target=darwin-arm64 \
            --origin=https://download-cn.suzuki.ink
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=DeepSeek YukiRyou update gate' \
            -addext 'subjectAltName=DNS:download-cn.suzuki.ink' \
            -keyout "${RUNNER_TEMP}/update-gate/server.key" \
            -out "${RUNNER_TEMP}/update-gate/server.crt"
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "${RUNNER_TEMP}/update-gate/server.crt"
          echo '127.0.0.1 download-cn.suzuki.ink' | sudo tee -a /etc/hosts
          sudo "$(command -v node)" scripts/serve-automatic-update-gate.ts \
            --cert="${RUNNER_TEMP}/update-gate/server.crt" \
            --key="${RUNNER_TEMP}/update-gate/server.key" \
            --assets="${RUNNER_TEMP}/update-gate/assets" \
            --metadata="${RUNNER_TEMP}/update-gate/metadata" \
            --target=darwin-arm64 --version="${RELEASE_VERSION}" --port=443 \
            > "${RUNNER_TEMP}/update-gate/server.log" 2>&1 &
          echo "UPDATE_GATE_SERVER_PID=$!" >> "${GITHUB_ENV}"
          for attempt in {1..30}; do
            curl --cacert "${RUNNER_TEMP}/update-gate/server.crt" \
              https://download-cn.suzuki.ink/health && exit 0
            sleep 1
          done
          cat "${RUNNER_TEMP}/update-gate/server.log"
          exit 1
      - name: Require the v1.0.4 manual-update bridge
        if: ${{ env.PREVIOUS_PUBLIC_VERSION == '1.0.4' }}
        run: |
          echo "::warning::v1.0.4 cannot complete the Squirrel.Mac window-close handoff. v1.0.5 is a one-time manual update; strict in-app update verification resumes for later versions."
          test -s \
            "out/release-candidate/${PRODUCT_NAME}-darwin-arm64-${RELEASE_VERSION}-candidate.zip"
      - name: Run the production updater through download, install, and relaunch
        if: ${{ env.PREVIOUS_PUBLIC_VERSION != '1.0.4' }}
        env:
          DSH_AUTOMATIC_UPDATE_SOURCE_EXECUTABLE_PATH: /Applications/DeepSeek YukiRyou.app/Contents/MacOS/DeepSeek YukiRyou
          DSH_AUTOMATIC_UPDATE_RELAUNCH_PATH: /Applications/DeepSeek YukiRyou.app/Contents/MacOS/DeepSeek YukiRyou
          DSH_AUTOMATIC_UPDATE_EXPECTED_VERSION: ${{ env.RELEASE_VERSION }}
          DSH_AUTOMATIC_UPDATE_DIAGNOSTICS: ${{ runner.temp }}/update-gate/diagnostics
          DSH_DESKTOP_DISTRIBUTION_REGION: china
        run: pnpm exec vitest run tests/release/automatic-update.test.ts --no-file-parallelism
      - name: Capture Squirrel.Mac diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p "${RUNNER_TEMP}/update-gate/diagnostics/ShipIt"
          find "${HOME}/Library/Caches/com.yukiryou.deepseek.yukiryou.ShipIt" \
            -maxdepth 1 -type f -exec cp '{}' "${RUNNER_TEMP}/update-gate/diagnostics/ShipIt/" \; \
            2>/dev/null || true
          defaults read com.yukiryou.deepseek.yukiryou.ShipIt \
            > "${RUNNER_TEMP}/update-gate/diagnostics/ShipIt-preferences.txt" 2>&1 || true
          node -e "const fs=require('node:fs');const p=process.env.RUNNER_TEMP+'/update-gate/diagnostics/desktop.log';if(fs.existsSync(p)){for(const line of fs.readFileSync(p,'utf8').split(/\r?\n/)){if(!line)continue;try{const entry=JSON.parse(line);if(/^(update\.|runtime\.)/.test(String(entry.event)))console.log(line)}catch{}}}"
          for snapshot in "${RUNNER_TEMP}/update-gate/diagnostics"/{application-old-process-exit-timeout.json,processes-old-process-exit-timeout.log,installed-version.txt}; do
            if [[ -f "${snapshot}" ]]; then
              echo "===== $(basename "${snapshot}") ====="
              if [[ "${snapshot}" == *processes-* ]]; then
                grep -E 'DeepSeek YukiRyou|ShipIt|Squirrel' "${snapshot}" || true
              else
                cat "${snapshot}"
              fi
            fi
          done
      - name: Upload updater gate diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-automatic-update-diagnostics
          path: |
            ${{ runner.temp }}/update-gate/diagnostics/
            ${{ runner.temp }}/update-gate/metadata/
            ${{ runner.temp }}/update-gate/server.log
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Create verified draft
    needs:
      - verify_final
      - windows
      - verify_macos_automatic_update
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: macos-notarized-artifacts
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          name: windows-x64-unsigned-exe-and-portable
          path: windows-assets
      - name: Verify and select public Windows assets
        run: |
          (cd windows-assets && shasum -a 256 -c SHA256SUMS)
          node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('windows-assets/windows-candidate-manifest.json','utf8'));if(m.schemaVersion!==1||m.version!==process.env.RELEASE_VERSION||m.target!=='win32-x64'||m.gitCommit!==process.env.GITHUB_SHA)throw new Error('Windows candidate does not match this release');const names=m.artifacts.map(a=>a.file);if(!names.includes('DeepSeek-YukiRyou-Setup.exe')||!names.includes('DeepSeek.YukiRyou-win32-x64-'+process.env.RELEASE_VERSION+'-portable.zip'))throw new Error('Windows public assets are missing')"
          cp windows-assets/DeepSeek-YukiRyou-Setup.exe "release-assets/${ARTIFACT_NAME}-${RELEASE_VERSION}-win32-x64-Setup.exe"
          cp "windows-assets/${ARTIFACT_NAME}-win32-x64-${RELEASE_VERSION}-portable.zip" release-assets/
          (cd release-assets && shasum -a 256 "${ARTIFACT_NAME}-${RELEASE_VERSION}-win32-x64-Setup.exe" "${ARTIFACT_NAME}-win32-x64-${RELEASE_VERSION}-portable.zip" > SHA256SUMS-Windows.txt)
      - name: Generate cross-platform auto-update metadata
        run: |
          node scripts/prepare-update-metadata.ts \
            --assets=release-assets \
            --output=update-metadata \
            --version="${RELEASE_VERSION}"
          cp update-metadata/darwin-arm64/latest-mac.yml release-assets/
          cp update-metadata/win32-x64/latest.yml release-assets/
      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--draft)
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "DeepSeek YukiRyou ${RELEASE_VERSION}" \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            "${release_flags[@]}" \
            release-assets/*
