name: Resume notarized desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version, for example 0.1.1-beta.1
        required: true
        type: string
      source_run_id:
        description: Failed Release macOS run containing accepted notarized artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: resume-macos-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.5'
  PRODUCT_NAME: DeepSeek YukiRyou
  ARTIFACT_NAME: DeepSeek.YukiRyou
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}

jobs:
  verify_and_create_draft:
    name: Reuse notarized artifacts, verify, and create draft
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Validate source run and release immutability
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_sha')
          source_workflow=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.path')
          test "${source_workflow}" = ".github/workflows/release-macos.yml"
          test -n "${source_sha}"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; versions are immutable."
            exit 1
          fi
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null || true)
          if [ -z "${tag_sha}" ]; then
            echo "A trusted lightweight tag ${RELEASE_TAG} must exist before recovery."
            exit 1
          fi
          if [ "${tag_sha}" != "${source_sha}" ]; then
            echo "Tag ${RELEASE_TAG} points to ${tag_sha}, expected ${source_sha}."
            exit 1
          fi
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@v5
        with:
          name: macos-notarized-artifacts
          path: out/release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        with:
          name: windows-x64-unsigned-exe-and-portable
          path: windows-assets
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Require matching notarized provenance
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('out/release/release-manifest.json','utf8')); if (m.schemaVersion !== 1 || m.version !== process.env.RELEASE_VERSION || m.architecture !== 'arm64' || m.gitCommit !== process.env.SOURCE_SHA || m.dirtyWorktree !== false || typeof m.notarizationSubmissionId !== 'string') throw new Error('Notarized artifact provenance does not match the source run')"
      - name: Normalize GitHub release asset names
        run: node scripts/normalize-release-asset-names.ts --directory=out/release
      - name: Verify and select public Windows assets
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          (cd windows-assets && shasum -a 256 -c SHA256SUMS)
          node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('windows-assets/windows-candidate-manifest.json','utf8'));if(m.schemaVersion!==1||m.version!==process.env.RELEASE_VERSION||m.target!=='win32-x64'||m.gitCommit!==process.env.SOURCE_SHA)throw new Error('Windows candidate does not match the resumed release');const names=m.artifacts.map(a=>a.file);if(!names.includes('DeepSeek-YukiRyou-Setup.exe')||!names.includes('DeepSeek.YukiRyou-win32-x64-'+process.env.RELEASE_VERSION+'-portable.zip'))throw new Error('Windows public assets are missing')"
          cp windows-assets/DeepSeek-YukiRyou-Setup.exe "out/release/${ARTIFACT_NAME}-${RELEASE_VERSION}-win32-x64-Setup.exe"
          cp "windows-assets/${ARTIFACT_NAME}-win32-x64-${RELEASE_VERSION}-portable.zip" out/release/
          (cd out/release && shasum -a 256 "${ARTIFACT_NAME}-${RELEASE_VERSION}-win32-x64-Setup.exe" "${ARTIFACT_NAME}-win32-x64-${RELEASE_VERSION}-portable.zip" > SHA256SUMS-Windows.txt)
      - name: Verify checksums
        working-directory: out/release
        run: |
          shasum -a 256 -c SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS-Windows.txt
      - name: Verify ZIP through Applications
        run: |
          pnpm verify:distribution -- \
            --kind=zip \
            --archive="out/release/${ARTIFACT_NAME}-darwin-arm64-${RELEASE_VERSION}.zip" \
            --install-app="/Applications/${PRODUCT_NAME}.app" \
            --expect-version="${RELEASE_VERSION}" \
            --require-notarized=true \
            --simulate-download=true
          mv "/Applications/${PRODUCT_NAME}.app" "${RUNNER_TEMP}/verified-from-zip.app"
      - name: Verify DMG through Applications
        run: |
          pnpm verify:distribution -- \
            --kind=dmg \
            --archive="out/release/${ARTIFACT_NAME}-${RELEASE_VERSION}-arm64.dmg" \
            --install-app="/Applications/${PRODUCT_NAME}.app" \
            --expect-version="${RELEASE_VERSION}" \
            --require-notarized=true \
            --simulate-download=true
      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DeepSeek YukiRyou ${RELEASE_VERSION}" \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            --draft \
            --prerelease \
            out/release/*
