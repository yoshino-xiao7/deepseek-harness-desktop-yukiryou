name: Validate existing macOS upgrade candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact candidate version, for example 1.0.7
        required: true
        type: string
      source_run_id:
        description: Release workflow run containing macos-release-candidate
        required: true
        type: string
      source_sha:
        description: Immutable commit used to build the candidate
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: validate-macos-upgrade-${{ inputs.version }}-${{ inputs.source_run_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.5'
  PRODUCT_NAME: DeepSeek YukiRyou
  ARTIFACT_NAME: DeepSeek.YukiRyou
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate_upgrade:
    name: Exercise only previous-version upgrade
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Validate the immutable source candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .path)" = ".github/workflows/release-macos.yml"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .head_sha)" = "${SOURCE_SHA}"
          test "${#SOURCE_SHA}" -eq 40
      - uses: actions/download-artifact@v5
        with:
          name: macos-release-candidate
          path: out/release-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Require matching candidate provenance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('out/release-candidate/candidate-manifest.json','utf8'));if(m.schemaVersion!==1||m.version!==process.env.RELEASE_VERSION||m.architecture!=='arm64'||m.gitCommit!==process.env.SOURCE_SHA||m.dirtyWorktree!==false)throw new Error('macOS candidate provenance does not match the requested source run')"
      - name: Install the exact existing candidate
        run: |
          pnpm verify:distribution -- \
            --kind=zip \
            --archive="out/release-candidate/${PRODUCT_NAME}-darwin-arm64-${RELEASE_VERSION}-candidate.zip" \
            --install-app="/Applications/${PRODUCT_NAME}.app" \
            --expect-version="${RELEASE_VERSION}" \
            --require-notarized=false \
            --candidate-manifest=out/release-candidate/candidate-manifest.json
      - name: Download and extract the previous public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          previous_version="${previous_tag#v}"
          echo "DSH_PREVIOUS_EXPECTED_VERSION=${previous_version}" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/previous-release" "${RUNNER_TEMP}/previous-app"
          gh release download "${previous_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ARTIFACT_NAME}-darwin-arm64-${previous_version}.zip" \
            --dir "${RUNNER_TEMP}/previous-release"
          ditto -x -k \
            "${RUNNER_TEMP}/previous-release/${ARTIFACT_NAME}-darwin-arm64-${previous_version}.zip" \
            "${RUNNER_TEMP}/previous-app"
      - name: Exercise only the previous-version upgrade gate
        env:
          DSH_E2E_EXECUTABLE_PATH: /Applications/DeepSeek YukiRyou.app/Contents/MacOS/DeepSeek YukiRyou
          DSH_PREVIOUS_EXECUTABLE_PATH: ${{ runner.temp }}/previous-app/DeepSeek YukiRyou.app/Contents/MacOS/DeepSeek YukiRyou
        run: pnpm test:upgrade
