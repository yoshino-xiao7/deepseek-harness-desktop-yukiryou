name: Windows x64 candidate

on:
  workflow_call:
    inputs:
      release_version:
        description: Exact candidate version when invoked as a release gate
        required: false
        type: string
        default: ''
      update_restart_only:
        description: Skip full candidate gates and exercise only update/restart
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact candidate version when manually exercising the release updater gate
        required: false
        type: string
        default: ''
      update_restart_only:
        description: Skip full candidate gates and exercise only update/restart
        required: false
        type: boolean
        default: true
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/windows-candidate.yml'
      - 'forge.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'resources/icons/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  # PR updates supersede older checks for the same PR. Manual release-gate
  # runs must use a fresh group so an incident-stale ref group cannot hold
  # every subsequent attempt in the queue.
  group: windows-candidate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.5'
  RUNNER_PWSH_PATH: 'C:\r\y\pwsh-7.6.4'

jobs:
  quality:
    name: Windows quality gate
    if: ${{ inputs.update_restart_only != true || inputs.release_version == '' }}
    runs-on: [self-hosted, Windows, X64, yukiryou-local]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Enable runner-local PowerShell 7
        shell: powershell
        run: |
          if (-not (Test-Path "$env:RUNNER_PWSH_PATH\pwsh.exe")) {
            throw "Runner PowerShell 7 is missing at $env:RUNNER_PWSH_PATH"
          }
          $env:RUNNER_PWSH_PATH | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Require an interactive Windows runner session
        run: ./scripts/require-interactive-windows-desktop.ps1
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${env:PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Diagnose native window bounds
        run: pnpm exec electron scripts/debug/window-bounds.cjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build_candidate:
    name: Vendor Runtime, make EXE + portable ZIP, and smoke
    needs: quality
    if: ${{ inputs.update_restart_only != true || inputs.release_version == '' }}
    runs-on: [self-hosted, Windows, X64, yukiryou-local]
    # Packaging and uploading the bundled 387 MiB / 55k-file Runtime is slow
    # on the physical runner. Keep enough headroom for lifecycle verification.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Enable runner-local PowerShell 7
        shell: powershell
        run: |
          if (-not (Test-Path "$env:RUNNER_PWSH_PATH\pwsh.exe")) {
            throw "Runner PowerShell 7 is missing at $env:RUNNER_PWSH_PATH"
          }
          $env:RUNNER_PWSH_PATH | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Require an interactive Windows runner session
        run: ./scripts/require-interactive-windows-desktop.ps1
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${env:PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Assemble and verify the host-native Runtime
        run: |
          pnpm runtime:vendor:win
          pnpm runtime:verify
      - name: Run integration tests against the verified Runtime
        run: pnpm test:integration
      - name: Build unsigned installer and portable candidates
        run: pnpm make:win
      - name: Verify updater bootstrap in packaged Windows application
        shell: pwsh
        run: |
          $config = 'out/DeepSeek YukiRyou-win32-x64/resources/app-update.yml'
          if (-not (Test-Path -LiteralPath $config)) { throw "Missing updater bootstrap: $config" }
          $content = Get-Content -LiteralPath $config -Raw
          foreach ($required in @('provider: github', 'owner: yoshino-xiao7', 'repo: deepseek-harness-desktop-yukiryou')) {
            if (-not $content.Contains($required)) { throw "Updater bootstrap is missing: $required" }
          }
      - name: Start and restart the exact packaged application
        env:
          DSH_E2E_EXECUTABLE_PATH: ${{ github.workspace }}\out\DeepSeek YukiRyou-win32-x64\DeepSeek YukiRyou.exe
        run: >-
          pnpm exec vitest run
          tests/e2e/packaged-startup.test.ts
          tests/e2e/session-selection-restart.test.ts
          tests/e2e/plugin-startup-recovery.test.ts
          tests/e2e/packaged-app.test.ts
          tests/e2e/window-state-persistence.test.ts
          --no-file-parallelism
      - name: Upload Windows UI verification screenshots
        if: ${{ always() && hashFiles('out/windows-ui-verification/*.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-verification
          path: out/windows-ui-verification/
          if-no-files-found: error
          retention-days: 14
      - name: Start and restart the exact portable ZIP application
        shell: pwsh
        run: |
          $archive = Get-ChildItem 'out/make/zip/win32/x64' -Filter '*.zip'
          if ($archive.Count -ne 1) { throw "Expected one portable ZIP, found $($archive.Count)" }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath 'out/windows-portable-smoke'
          $executables = @(Get-ChildItem 'out/windows-portable-smoke' -Recurse -Filter 'DeepSeek YukiRyou.exe')
          if ($executables.Count -ne 1) { throw "Expected one portable executable, found $($executables.Count)" }
          $updateConfigs = @(Get-ChildItem 'out/windows-portable-smoke' -Recurse -Filter 'app-update.yml')
          if ($updateConfigs.Count -ne 1) { throw "Expected one updater bootstrap, found $($updateConfigs.Count)" }
          $env:DSH_E2E_EXECUTABLE_PATH = $executables[0].FullName
          "DSH_E2E_EXECUTABLE_PATH=$($executables[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          pnpm exec vitest run tests/e2e/packaged-startup.test.ts tests/e2e/session-selection-restart.test.ts --no-file-parallelism
      - name: Validate and freeze NSIS artifacts
        run: pnpm release:win:candidate
      - name: Verify candidate provenance
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          node -e "const fs=require('node:fs');
          const p=require('./package.json');
          const m=JSON.parse(fs.readFileSync('out/windows-candidate/windows-candidate-manifest.json','utf8'));
          if(m.schemaVersion!==1||m.version!==p.version||m.target!=='win32-x64'||m.gitCommit!==process.env.EXPECTED_COMMIT||m.artifacts.length!==2||!m.artifacts.some(a=>a.file.endsWith('-portable.zip')))
          throw new Error('Windows candidate provenance mismatch')"
      - name: Prepare and verify the release candidate automatic update
        if: ${{ inputs.release_version != '' }}
        timeout-minutes: 25
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          DSH_DESKTOP_DISTRIBUTION_REGION: china
        run: |
          "RELEASE_VERSION=$env:RELEASE_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ./scripts/windows-automatic-update-gate.ps1 -Action Prepare
          pnpm exec vitest run tests/release/automatic-update.test.ts --no-file-parallelism
      - name: Clean the isolated automatic-update gate
        if: ${{ always() && inputs.release_version != '' && hashFiles('out/windows-automatic-update-gate/state.json') != '' }}
        shell: pwsh
        run: ./scripts/windows-automatic-update-gate.ps1 -Action Cleanup
      - name: Upload automatic-update diagnostics
        if: ${{ failure() && inputs.release_version != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-automatic-update-diagnostics
          path: |
            out/windows-automatic-update-gate/diagnostics/
            out/windows-automatic-update-gate/metadata/
            out/windows-automatic-update-gate/synthetic-successor/
            out/windows-automatic-update-gate/server.log
            out/windows-automatic-update-gate/server-error.log
            out/windows-automatic-update-gate/state.json
          if-no-files-found: warn
          retention-days: 14
      - name: Recover an interrupted lifecycle test installation
        shell: pwsh
        run: ./scripts/windows-nsis-lifecycle.ps1 -Action Recover
      - name: Install the frozen guided NSIS candidate
        shell: pwsh
        run: |
          ./scripts/windows-nsis-lifecycle.ps1 -Action Install
          $state = Get-Content 'out/windows-lifecycle/state.json' -Raw | ConvertFrom-Json
          "DSH_E2E_EXECUTABLE_PATH=$($state.executable)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Start the installed application
        shell: pwsh
        run: |
          # The interactive runner may still have a manually opened release or
          # a process started by Windows after installer registration. A stale
          # app-wide single-instance lock would redirect Playwright's launch.
          Get-Process -Name 'DeepSeek YukiRyou' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          pnpm exec vitest run tests/e2e/packaged-startup.test.ts tests/e2e/session-selection-restart.test.ts --no-file-parallelism
      - name: Collect installed startup diagnostics
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE 'out/windows-installed-diagnostics'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Get-Process -Name 'DeepSeek YukiRyou' -ErrorAction SilentlyContinue |
            Select-Object Id, Path, StartTime, Responding |
            ConvertTo-Json | Set-Content (Join-Path $destination 'processes.json') -Encoding utf8
          Get-ChildItem $env:TEMP -Directory -Filter 'dsh-*-e2e-*' -ErrorAction SilentlyContinue |
            ForEach-Object {
              $logs = Join-Path $_.FullName 'logs'
              if (Test-Path -LiteralPath $logs) {
                Copy-Item -LiteralPath $logs -Destination (Join-Path $destination $_.Name) -Recurse -Force
              }
            }
      - name: Stop failed installed application before cleanup
        if: ${{ failure() }}
        shell: pwsh
        run: >-
          Get-Process -Name 'DeepSeek YukiRyou' -ErrorAction SilentlyContinue |
          Stop-Process -Force
      - name: Repair-install the same candidate and restart it
        shell: pwsh
        run: |
          ./scripts/windows-nsis-lifecycle.ps1 -Action Repair
          pnpm exec vitest run tests/e2e/packaged-startup.test.ts --no-file-parallelism
      - name: Uninstall and verify shortcuts and user-data retention
        if: ${{ always() && hashFiles('out/windows-lifecycle/state.json') != '' }}
        shell: pwsh
        run: ./scripts/windows-nsis-lifecycle.ps1 -Action Uninstall
      - name: Upload installed startup diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-startup-diagnostics
          path: out/windows-installed-diagnostics/
          # Earlier release-gate failures can happen before the lifecycle test
          # creates this directory. Do not mask the primary failure with a
          # second diagnostics-upload error.
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: windows-x64-unsigned-exe-and-portable
          path: out/windows-candidate/
          if-no-files-found: error
          retention-days: 14

  update_restart:
    name: Update and restart only
    if: ${{ inputs.update_restart_only == true && inputs.release_version != '' }}
    runs-on: [self-hosted, Windows, X64, yukiryou-local]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Enable runner-local PowerShell 7
        shell: powershell
        run: |
          if (-not (Test-Path "$env:RUNNER_PWSH_PATH\pwsh.exe")) {
            throw "Runner PowerShell 7 is missing at $env:RUNNER_PWSH_PATH"
          }
          $env:RUNNER_PWSH_PATH | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Require an interactive Windows runner session
        run: ./scripts/require-interactive-windows-desktop.ps1
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${env:PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Assemble the Windows Runtime and packaged application
        run: |
          pnpm runtime:vendor:win
          pnpm package:win
      - name: Build only the base NSIS installer required by the update rehearsal
        shell: pwsh
        run: >-
          pnpm exec electron-builder --win nsis --x64
          --prepackaged "out/DeepSeek YukiRyou-win32-x64"
          --publish never
          "-c.directories.output=out/windows-candidate"
          "-c.artifactName=DeepSeek-YukiRyou-Setup.exe"
      - name: Exercise only automatic update and restart
        timeout-minutes: 20
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          DSH_DESKTOP_DISTRIBUTION_REGION: china
        run: |
          ./scripts/windows-automatic-update-gate.ps1 -Action Prepare
          pnpm exec vitest run tests/release/automatic-update.test.ts --no-file-parallelism
      - name: Upload compact automatic-update diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-automatic-update-diagnostics
          path: |
            out/windows-automatic-update-gate/diagnostics/
            out/windows-automatic-update-gate/metadata/
            out/windows-automatic-update-gate/server.log
            out/windows-automatic-update-gate/server-error.log
            out/windows-automatic-update-gate/state.json
          if-no-files-found: warn
          retention-days: 7
      - name: Clean the isolated automatic-update gate
        if: ${{ always() && hashFiles('out/windows-automatic-update-gate/state.json') != '' }}
        shell: pwsh
        run: ./scripts/windows-automatic-update-gate.ps1 -Action Cleanup
