name: Publish verified desktop draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing verified draft version, for example 0.1.1-beta.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-macos-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.5'
  PRODUCT_NAME: DeepSeek YukiRyou
  ARTIFACT_NAME: DeepSeek.YukiRyou
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}

jobs:
  verify_and_publish:
    name: Download, install, verify, then publish
    runs-on: macos-15
    steps:
      - name: Require an unpublished prerelease draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease,tagName,targetCommitish)
          target=$(node -e "const r=JSON.parse(process.argv[1]); if (!r.isDraft || !r.isPrerelease || r.tagName !== process.env.RELEASE_TAG) throw new Error('Release must be the matching prerelease draft'); if (!/^[0-9a-f]{40}$/.test(r.targetCommitish)) throw new Error('Draft must target an immutable commit SHA'); process.stdout.write(r.targetCommitish)" "${release_json}")
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.draft.outputs.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - run: pnpm install --frozen-lockfile
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-assets
      - name: Require matching release provenance
        env:
          TARGET_COMMIT: ${{ steps.draft.outputs.target }}
        run: |
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('release-assets/release-manifest.json','utf8')); if (m.schemaVersion !== 1 || m.version !== process.env.RELEASE_VERSION || m.architecture !== 'arm64' || m.gitCommit !== process.env.TARGET_COMMIT || m.dirtyWorktree !== false || typeof m.notarizationSubmissionId !== 'string') throw new Error('Draft assets do not match release provenance')"
      - name: Verify checksums
        working-directory: release-assets
        run: |
          shasum -a 256 -c SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS-Windows.txt
      - name: Reinstall and verify ZIP
        run: |
          pnpm verify:distribution -- \
            --kind=zip \
            --archive="release-assets/${ARTIFACT_NAME}-darwin-arm64-${RELEASE_VERSION}.zip" \
            --install-app="/Applications/${PRODUCT_NAME}.app" \
            --expect-version="${RELEASE_VERSION}" \
            --require-notarized=true \
            --simulate-download=true
          mv "/Applications/${PRODUCT_NAME}.app" "${RUNNER_TEMP}/verified-publish-zip.app"
      - name: Reinstall and verify DMG
        run: |
          pnpm verify:distribution -- \
            --kind=dmg \
            --archive="release-assets/${ARTIFACT_NAME}-${RELEASE_VERSION}-arm64.dmg" \
            --install-app="/Applications/${PRODUCT_NAME}.app" \
            --expect-version="${RELEASE_VERSION}" \
            --require-notarized=true \
            --simulate-download=true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --prerelease=false
